<style>
  :root{--ink:#1c1c1e;--line:#1c1c1e;--accent:#2f5d8a;--ok:#2e8b57;--bad:#c0392b;--bg:#f4f1ea}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none}
  .wrap{max-width:980px;margin:0 auto;padding:12px 12px 40px}
  .tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .tab{border:2px solid var(--accent);background:#fff;color:var(--accent);padding:8px 16px;border-radius:999px;font:600 15px inherit;font-family:inherit;cursor:pointer}
  .tab[aria-selected=true]{background:var(--accent);color:#fff}
  .sheet{background:#fff;border-radius:10px;box-shadow:0 2px 14px rgba(0,0,0,.12);overflow:hidden;padding-bottom:18px}
  .sheet img.head{display:block;width:100%}
  .task{font-weight:700;font-size:clamp(15px,2.3vw,21px);line-height:1.35;margin:12px 5% 6px}
  .fig{position:relative;container-type:inline-size;width:90%;margin:0 auto}
  .fig>img{display:block;width:100%;height:auto;pointer-events:none;-webkit-user-drag:none}
  .arrows{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .field{position:absolute;background:#fff;border:.28cqw solid var(--line);border-radius:1.1cqw;display:flex;align-items:center;justify-content:center;transition:background .15s,border-color .15s}
  .field.over{background:#e3eefa;border-color:var(--accent)}
  .field.ok{border-color:var(--ok);background:#e8f6ee}
  .field.bad{border-color:var(--bad);background:#fdeceb}
  .field .tile{font-size:var(--fs)}
  .bankhead{font-weight:800;font-size:clamp(18px,3vw,26px);margin:14px 5% 4px}
  .bank{margin:0 5%;min-height:70px;display:flex;flex-wrap:wrap;gap:10px;padding:12px;border:2px dashed #b9b2a0;border-radius:12px;background:#faf8f3;touch-action:none}
  .bank.over{background:#e3eefa;border-color:var(--accent)}
  .tile{display:inline-block;padding:7px 14px;border-radius:8px;background:#fff;border:2px solid var(--accent);color:var(--ink);font-weight:700;font-size:clamp(15px,2.2vw,20px);cursor:grab;touch-action:none;white-space:nowrap;line-height:1.15;box-shadow:0 1px 3px rgba(0,0,0,.15)}
  .field .tile{padding:0 .6em;border:none;box-shadow:none;background:transparent;width:100%;text-align:center;cursor:grab}
  .tile.sel{outline:3px solid #e6a100;outline-offset:2px}
  .tile.dragging{opacity:.35}
  .ghost{position:fixed;z-index:99;pointer-events:none;transform:translate(-50%,-50%) scale(1.06);box-shadow:0 6px 18px rgba(0,0,0,.3);background:#fff}
  .controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:16px 5% 0}
  button.act{font:600 15px inherit;font-family:inherit;padding:10px 18px;border-radius:8px;border:2px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
  button.act.sec{background:#fff;color:var(--accent)}
  .msg{font-weight:700;font-size:16px;margin-left:4px}
  .hint{margin:10px 5% 0;color:#666;font-size:13px}
  @media print{body{background:#fff}.tabs,.controls,.hint{display:none}.sheet{box-shadow:none}}
.bl{display:inline-block;font:600 15px system-ui,sans-serif;color:#2f5d8a;text-decoration:none;border:2px solid #2f5d8a;border-radius:8px;padding:7px 14px;background:#fff;margin-bottom:10px}@media print{.bl{display:none}}</style>

const stage=document.getElementById('stage'), tabsEl=document.getElementById('tabs');
let current=0; const states={};

DATA.forEach((d,i)=>{
  const b=document.createElement('button');b.className='tab';b.setAttribute('role','tab');b.textContent=d.tab;
  b.onclick=()=>show(i);tabsEl.appendChild(b);
});
function show(i){current=i;[...tabsEl.children].forEach((b,j)=>b.setAttribute('aria-selected',j===i));
  stage.innerHTML='';stage.appendChild(states[i]?states[i].root:build(i));}

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function build(idx){
  const d=DATA[idx];
  const root=document.createElement('div');root.className='sheet';
  root.innerHTML=`<img class="head" alt="${d.title}" src="data:image/jpeg;base64,${d.head}">
  <div class="task">Aufgabe: ${d.task}</div>
  <div class="fig"><img alt="Abbildung" src="data:image/jpeg;base64,${d.img}"></div>
  <div class="bankhead">Begriffe</div>
  <div class="bank"></div>
  <div class="controls">
    <button class="act">Überprüfen</button>
    <button class="act sec">Zurücksetzen</button>
    <button class="act sec">Lösung zeigen</button>
    <span class="msg"></span>
  </div>
  <div class="hint">Begriff mit dem Finger oder der Maus in das passende Feld ziehen – oder erst den Begriff antippen, dann das Feld.</div>`;
  const fig=root.querySelector('.fig'), bank=root.querySelector('.bank'), msg=root.querySelector('.msg');
  const [bCheck,bReset,bSolve]=root.querySelectorAll('button.act');
  const st={root,fields:[],tiles:[],sel:null};states[idx]=st;

  if(d.arrows.length){
    const ns='http://www.w3.org/2000/svg';
    const svg=document.createElementNS(ns,'svg');svg.setAttribute('class','arrows');svg.setAttribute('viewBox',`0 0 ${d.w} ${d.h}`);
    svg.innerHTML=`<defs><marker id="ah${idx}" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#000"/></marker></defs>`+
      d.arrows.map(a=>`<line x1="${a.x1}" y1="${a.y1}" x2="${a.x2}" y2="${a.y2}" stroke="#000" stroke-width="3" marker-end="url(#ah${idx})"/>`).join('');
    fig.appendChild(svg);
  }
  d.fields.forEach(f=>{
    const el=document.createElement('div');el.className='field';
    el.style.left=(f.x/d.w*100)+'%';el.style.top=(f.y/d.h*100)+'%';
    el.style.width=(f.w/d.w*100)+'%';el.style.height=(f.h/d.h*100)+'%';
    const wcq=f.w/d.w*100;
    el.style.setProperty('--fs',Math.min(2.3,wcq*0.78/(f.a.length*0.56))+'cqw');
    fig.appendChild(el);
    st.fields.push({el,a:f.a,tile:null});
  });
  shuffle(d.terms).forEach(t=>{
    const el=document.createElement('div');el.className='tile';el.textContent=t;
    const tile={el,text:t,home:bank};st.tiles.push(tile);el.__tile=tile;bank.appendChild(el);
    attachDrag(el,tile);
  });

  function fieldOf(tile){return st.fields.find(f=>f.tile===tile);}
  function clearMarks(){st.fields.forEach(f=>f.el.classList.remove('ok','bad'));msg.textContent='';}
  function place(tile,target){ // target: field obj or 'bank'
    const src=fieldOf(tile);
    if(target==='bank'){ if(src){src.tile=null;} bank.appendChild(tile.el); return; }
    if(target.tile===tile) return;
    const other=target.tile;
    if(src) src.tile=null;
    if(other){ if(src){src.tile=other;src.el.appendChild(other.el);} else bank.appendChild(other.el); }
    target.tile=tile; target.el.appendChild(tile.el);
  }
  function select(tile){ if(st.sel) st.sel.el.classList.remove('sel'); st.sel=tile; if(tile) tile.el.classList.add('sel'); }

  function targetAt(x,y){
    const e=document.elementFromPoint(x,y); if(!e) return null;
    const fe=e.closest('.field'); if(fe&&root.contains(fe)) return st.fields.find(f=>f.el===fe);
    if(e.closest('.bank')) return 'bank';
    return null;
  }
  function attachDrag(el,tile){
    let drag=null;
    el.addEventListener('pointerdown',ev=>{
      if(ev.button>0) return;
      drag={sx:ev.clientX,sy:ev.clientY,moved:false,ghost:null,id:ev.pointerId};
      el.setPointerCapture(ev.pointerId);
    });
    el.addEventListener('pointermove',ev=>{
      if(!drag) return;
      if(!drag.moved && Math.hypot(ev.clientX-drag.sx,ev.clientY-drag.sy)>6){
        drag.moved=true;
        const g=el.cloneNode(true);g.classList.add('ghost');g.style.fontSize=getComputedStyle(el).fontSize;
        if(el.parentElement.classList.contains('field')){g.style.width=el.offsetWidth+'px';}
        document.body.appendChild(g);drag.ghost=g;el.classList.add('dragging');
      }
      if(drag.moved){
        drag.ghost.style.left=ev.clientX+'px';drag.ghost.style.top=ev.clientY+'px';
        root.querySelectorAll('.over').forEach(x=>x.classList.remove('over'));
        drag.ghost.style.display='none';const t=targetAt(ev.clientX,ev.clientY);drag.ghost.style.display='';
        if(t) (t==='bank'?bank:t.el).classList.add('over');
      }
    });
    function end(ev,cancel){
      if(!drag) return; const d0=drag; drag=null;
      try{el.releasePointerCapture(d0.id);}catch(e){}
      root.querySelectorAll('.over').forEach(x=>x.classList.remove('over'));
      if(d0.moved){
        d0.ghost.style.display='none';const t=cancel?null:targetAt(ev.clientX,ev.clientY);d0.ghost.remove();
        el.classList.remove('dragging');
        if(t){clearMarks();place(tile,t);select(null);}
      } else if(!cancel){ // tap
        select(st.sel===tile?null:tile);
      }
    }
    el.addEventListener('pointerup',ev=>end(ev,false));
    el.addEventListener('pointercancel',ev=>end(ev,true));
  }
  // tap on field / bank with a selected tile
  st.fields.forEach(f=>f.el.addEventListener('click',ev=>{
    if(ev.target.closest('.tile')&&!st.sel) return;
    if(st.sel){clearMarks();place(st.sel,f);select(null);}
  }));
  bank.addEventListener('click',ev=>{ if(st.sel&&!ev.target.closest('.tile')){clearMarks();place(st.sel,'bank');select(null);} });

  bCheck.onclick=()=>{
    let ok=0,empty=0;
    st.fields.forEach(f=>{f.el.classList.remove('ok','bad');
      if(!f.tile){empty++;return;}
      if(f.tile.text===f.a){ok++;f.el.classList.add('ok');} else f.el.classList.add('bad');});
    const n=st.fields.length;
    msg.style.color=ok===n?'var(--ok)':'var(--ink)';
    msg.textContent=ok===n?`Alles richtig! 🎉 (${n} von ${n})`:`${ok} von ${n} richtig`+(empty?` – ${empty} Feld${empty>1?'er':''} noch leer`:'');
  };
  bReset.onclick=()=>{st.fields.forEach(f=>f.tile=null);shuffle(st.tiles).forEach(t=>bank.appendChild(t.el));select(null);clearMarks();};
  bSolve.onclick=()=>{
    st.fields.forEach(f=>f.tile=null);st.tiles.forEach(t=>bank.appendChild(t.el));
    st.fields.forEach(f=>{const t=st.tiles.find(t=>t.text===f.a&&!fieldOf(t));if(t){f.tile=t;f.el.appendChild(t.el);}});
    select(null);st.fields.forEach(f=>f.el.classList.add('ok'));msg.textContent='Lösung';msg.style.color='var(--ink)';
  };
  return root;
}
show(0);
</script>
</body>
</html>
