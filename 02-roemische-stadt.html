<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eine römische Stadt</title><style>:root{--ink:#1f1d1a;--accent:#2f5d8a;--accent2:#8a2f2f;--ok:#2e8b57;--bad:#c0392b;--bg:#f4f1ea;--card:#fff;--line:#d8d2c2;--soft:#faf8f3}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
.page{max-width:980px;margin:0 auto;padding:10px 10px 40px}
.sheet{background:var(--card);border-radius:12px;box-shadow:0 2px 14px rgba(0,0,0,.12);overflow:hidden;padding-bottom:20px}
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:4px solid #111}
.top img.logo{height:46px;width:auto}
.top h1{flex:1;margin:0;font-weight:500;font-size:clamp(18px,3.4vw,32px);text-align:center;line-height:1.15}
.top img.mascot{height:58px;width:58px;border-radius:50%;border:3px solid #b98a4a;background:#fff;object-fit:cover}
.namebar{display:flex;gap:8px;align-items:center;padding:10px 5% 0;font-size:14px;color:#555}
.namebar input{flex:1;max-width:320px;font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:8px}
.block{margin:18px 5% 0}
.block>h2{font-size:clamp(16px,2.4vw,20px);margin:0 0 6px;display:flex;gap:10px;align-items:flex-start;line-height:1.3}
.block>h2 .num{flex:none;background:var(--accent);color:#fff;border-radius:50%;width:28px;height:28px;display:grid;place-items:center;font-size:15px;margin-top:-1px}
.task{margin:0 0 10px;color:#333}
.box{background:var(--soft);border:1px solid var(--line);border-left:5px solid #b98a4a;border-radius:8px;padding:10px 14px;margin:8px 0}
.box.read{font-size:16px}
.box h3{margin:0 0 4px;font-size:16px}
.box p{margin:6px 0}
.fig{position:relative;container-type:inline-size;width:100%;margin:0 auto;border-radius:6px;overflow:hidden;background:#fff}
.fig>img.bg,.fig>.bgsvg{display:block;width:100%;height:100%;pointer-events:none;-webkit-user-drag:none;position:absolute;inset:0}
.fig .bgsvg svg{width:100%;height:100%;display:block}
.slot{position:absolute;background:#fffefb;border:.25cqw dashed var(--accent);border-radius:.9cqw;display:flex;align-items:center;justify-content:center;transition:background .12s,border-color .12s;overflow:hidden}
.slot .tile{white-space:nowrap}.slot .tile.long{white-space:normal;font-weight:650}
.slot.over,.bucket.over,.rowslot.over{background:#e3eefa!important;border-color:var(--accent)!important;border-style:solid}
.slot.ok,.rowslot.ok{border-color:var(--ok)!important;border-style:solid;background:#e8f6ee!important}
.slot.bad,.rowslot.bad{border-color:var(--bad)!important;border-style:solid;background:#fdeceb!important}
.slot .tile,.slot .tile.long{font-size:var(--fs)!important;line-height:1.12;padding:0 .5em;border:none;box-shadow:none;background:transparent;width:100%;text-align:center;border-radius:0}
.bank{margin-top:10px;min-height:62px;display:flex;flex-wrap:wrap;gap:8px;padding:10px;border:2px dashed #b9b2a0;border-radius:12px;background:var(--soft);touch-action:pan-y}
.bank.over{background:#e3eefa;border-color:var(--accent)}
.bank:empty::after{content:"Alle Begriffe sind verteilt.";color:#999;font-size:14px;align-self:center}
.tile{display:inline-block;padding:6px 12px;border-radius:8px;background:#fff;border:2px solid var(--accent);color:var(--ink);font-weight:650;font-size:clamp(14px,2vw,18px);cursor:grab;touch-action:none;line-height:1.2;box-shadow:0 1px 3px rgba(0,0,0,.15);user-select:none;-webkit-user-select:none;max-width:100%}
.tile.long{font-weight:500;font-size:clamp(13px,1.9vw,16px);white-space:normal}
.tile.sel{outline:3px solid #e6a100;outline-offset:2px}
.tile.dragging{opacity:.3}
.tile.ok{border-color:var(--ok);background:#e8f6ee}
.tile.bad{border-color:var(--bad);background:#fdeceb}
.ghost{position:fixed;z-index:9999;pointer-events:none;transform:translate(-50%,-50%) scale(1.05);box-shadow:0 8px 20px rgba(0,0,0,.3)}
.rows{display:grid;gap:8px}
.row{display:grid;grid-template-columns:1fr minmax(120px,38%);gap:10px;align-items:center;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.row .lab{font-size:15px}
.rowslot{min-height:42px;border:2px dashed var(--accent);border-radius:8px;background:#fffefb;display:flex;align-items:center;justify-content:center;padding:2px}
.rowslot .tile{width:100%;text-align:center}
.buckets{display:grid;grid-template-columns:repeat(var(--cols,3),1fr);gap:10px}
.bucket{border:2px dashed #aaa;border-radius:10px;background:#fffefb;min-height:120px;padding:8px;display:flex;flex-direction:column;gap:6px}
.bucket h3{margin:0;text-align:center;font-size:15px;padding:4px 6px;border-radius:6px;color:#fff;background:var(--c,#555)}
.bucket .body{display:flex;flex-direction:column;gap:6px;flex:1}
.bucket .body .tile{width:100%}
@media(max-width:620px){.buckets{grid-template-columns:1fr}.row{grid-template-columns:1fr}}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
button.act{font:600 15px inherit;font-family:inherit;padding:9px 16px;border-radius:8px;border:2px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.act.sec{background:#fff;color:var(--accent)}
button.act:disabled{opacity:.5;cursor:default}
.msg{font-weight:700;font-size:15px}
.msg.good{color:var(--ok)}
.hint{color:#666;font-size:13px;margin-top:6px}
select.cz{font:inherit;font-weight:600;padding:3px 6px;border:2px solid var(--accent);border-radius:6px;background:#fff;max-width:100%}
select.cz.ok{border-color:var(--ok);background:#e8f6ee}
select.cz.bad{border-color:var(--bad);background:#fdeceb}
.cloze{font-size:16px;line-height:2.1}
.mcq{margin:10px 0;padding:10px 12px;background:var(--soft);border:1px solid var(--line);border-radius:8px}
.mcq .q{font-weight:650;margin-bottom:6px}
.opts{display:grid;gap:6px}
.opt{text-align:left;font:inherit;padding:8px 12px;border:2px solid #cfc8b6;border-radius:8px;background:#fff;cursor:pointer}
.opt:hover{border-color:var(--accent)}
.opt.ok{border-color:var(--ok);background:#e8f6ee}
.opt.bad{border-color:var(--bad);background:#fdeceb}
.opt.sel{border-color:var(--accent);background:#e3eefa}
.why{margin-top:6px;font-size:14px;color:#333;display:none}
.why.show{display:block}
textarea.open{width:100%;min-height:110px;font:inherit;padding:10px;border:2px solid var(--line);border-radius:8px;resize:vertical;background:#fffefb}
textarea.open:focus,.namebar input:focus{outline:none;border-color:var(--accent)}
input.line{width:100%;font:inherit;padding:8px 10px;border:2px solid var(--line);border-radius:8px;background:#fffefb}
.starters{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.chip{font:inherit;font-size:13px;padding:4px 10px;border-radius:999px;border:1px solid var(--accent);background:#fff;color:var(--accent);cursor:pointer}
.checks{display:grid;gap:4px;margin-top:6px}
.checks label{display:flex;gap:8px;align-items:flex-start;font-size:14px;cursor:pointer}
.counter{font-size:12px;color:#777;text-align:right}
.rate{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.rate .btns{display:flex;gap:4px}
.rate button{font-size:22px;border:2px solid #ddd;background:#fff;border-radius:8px;padding:2px 8px;cursor:pointer;opacity:.55}
.rate button.sel{opacity:1;border-color:var(--accent);background:#e3eefa}
.result{margin:20px 5% 0;border-top:3px double var(--line);padding-top:14px}
.result textarea{width:100%;min-height:150px;font:14px/1.4 ui-monospace,Menlo,Consolas,monospace;padding:8px;border:2px solid var(--line);border-radius:8px}
.table{width:100%;border-collapse:collapse;margin:6px 0;font-size:15px}
.table th,.table td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.table th{background:var(--soft)}
.mini{font-size:13px;color:#666}
.tag{display:inline-block;padding:1px 8px;border-radius:999px;color:#fff;font-size:12px;font-weight:700}
@media print{body{background:#fff}.ctrl,.hint,.bank,.result .ctrl{display:none}.sheet{box-shadow:none}}

.backlink{display:inline-block;font:600 15px system-ui,sans-serif;color:var(--accent);text-decoration:none;border:2px solid var(--accent);border-radius:8px;padding:7px 14px;background:#fff}
.backlink:hover{background:#e3eefa}
.backlink.top{margin:0 0 10px}
@media print{.backlink{display:none}}
</style></head>

const IMG=window.__IMG||{};
function h(tag,attrs,...kids){
  const e=document.createElement(tag);
  for(const k in (attrs||{})){const v=attrs[k];
    if(k==='class')e.className=v; else if(k==='html')e.innerHTML=v;
    else if(k==='style')e.style.cssText=v; else if(k.startsWith('on'))e[k]=v;

}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function strip(s){return String(s).replace(/<[^>]+>/g,'').replace(/&nbsp;/g,' ').trim();}

/* ---------- Drag engine ---------- */
function Engine(o){
  // o: {root, bank, slots:[{el,body,accepts,multi,label,id}], tiles:[{text,key,cat,long}]}
  const E={slots:o.slots,tiles:[],bank:o.bank,sel:null};
  E.slots.forEach(s=>{s.items=[];s.body=s.body||s.el;s.el.__slot=s;});
  function loc(t){return E.slots.find(s=>s.items.includes(t))||null;}
  function removeFrom(s,t){s.items=s.items.filter(x=>x!==t);}
  function place(t,target){
    const from=loc(t);
    if(target==='bank'){ if(from)removeFrom(from,t); E.bank.appendChild(t.el); return; }
    if(from===target)return;
    if(!target.multi&&target.items.length){
      const other=target.items[0]; removeFrom(target,other);
      if(from){from.items.push(other);from.body.appendChild(other.el);} else E.bank.appendChild(other.el);
    }
    if(from)removeFrom(from,t);
    target.items.push(t);target.body.appendChild(t.el);
  }
  function clearMarks(){E.slots.forEach(s=>s.el.classList.remove('ok','bad'));E.tiles.forEach(t=>t.el.classList.remove('ok','bad'));}
  function select(t){ if(E.sel)E.sel.el.classList.remove('sel'); E.sel=t; if(t)t.el.classList.add('sel'); }
  function targetAt(x,y){
    const e=document.elementFromPoint(x,y); if(!e)return null;
    const se=e.closest('.slot,.rowslot,.bucket'); if(se&&se.__slot&&E.slots.includes(se.__slot))return se.__slot;
    if(e.closest('.bank')===E.bank)return 'bank';
    return null;
  }
  function attach(t){
    const el=t.el;let d=null;
    el.addEventListener('pointerdown',ev=>{ if(ev.button>0)return; d={sx:ev.clientX,sy:ev.clientY,moved:false,id:ev.pointerId,g:null}; try{el.setPointerCapture(ev.pointerId);}catch(e){} });
    el.addEventListener('pointermove',ev=>{
      if(!d)return;
      if(!d.moved&&Math.hypot(ev.clientX-d.sx,ev.clientY-d.sy)>6){
        d.moved=true; const g=el.cloneNode(true); g.className='tile ghost'+(t.long?' long':''); g.style.fontSize=getComputedStyle(el).fontSize;
        g.style.width=Math.min(el.offsetWidth+8,320)+'px'; g.style.textAlign='center'; document.body.appendChild(g); d.g=g; el.classList.add('dragging');
      }
      if(d.moved){
        d.g.style.left=ev.clientX+'px';d.g.style.top=ev.clientY+'px';
        o.root.querySelectorAll('.over').forEach(x=>x.classList.remove('over'));
        d.g.style.display='none';const tg=targetAt(ev.clientX,ev.clientY);d.g.style.display='';
        if(tg)(tg==='bank'?E.bank:tg.el).classList.add('over');
      }
    });
    function end(ev,cancel){
      if(!d)return;const dd=d;d=null;
      try{el.releasePointerCapture(dd.id);}catch(e){}
      o.root.querySelectorAll('.over').forEach(x=>x.classList.remove('over'));
      if(dd.moved){
        dd.g.style.display='none';const tg=cancel?null:targetAt(ev.clientX,ev.clientY);dd.g.remove();el.classList.remove('dragging');
        if(tg){clearMarks();place(t,tg);select(null);E.onchange&&E.onchange();}
      }else if(!cancel){select(E.sel===t?null:t);}
    }
    el.addEventListener('pointerup',ev=>end(ev,false));
    el.addEventListener('pointercancel',ev=>end(ev,true));
  }
  (o.tiles||[]).forEach(tt=>{
    const t={text:tt.text,key:tt.key!=null?tt.key:tt.text,cat:tt.cat,long:tt.long};
    t.el=h('div',{class:'tile'+(t.long?' long':'')},t.text);t.el.__tile=t;E.tiles.push(t);attach(t);
  });
  shuffle(E.tiles).forEach(t=>E.bank.appendChild(t.el));
  E.slots.forEach(s=>s.el.addEventListener('click',ev=>{ if(E.sel&&!ev.target.closest('.tile')||E.sel&&ev.target.closest('.tile')===null){clearMarks();place(E.sel,s);select(null);E.onchange&&E.onchange();} }));
  E.slots.forEach(s=>s.el.addEventListener('click',ev=>{ const tl=ev.target.closest('.tile'); if(E.sel&&tl&&tl.__tile&&tl.__tile!==E.sel&&s.items.includes(tl.__tile)){clearMarks();place(E.sel,s);select(null);E.onchange&&E.onchange();} }));
  E.bank.addEventListener('click',ev=>{ if(E.sel&&!ev.target.closest('.tile')){clearMarks();place(E.sel,'bank');select(null);E.onchange&&E.onchange();} });
  E.multi=E.slots.some(s=>s.multi);
  E.check=function(){
    clearMarks();let ok=0,empty=0,total;
    if(E.multi){
      total=E.tiles.length;
      E.tiles.forEach(t=>{const s=loc(t); if(!s){empty++;return;} if(s.accepts(t)){ok++;t.el.classList.add('ok');}else t.el.classList.add('bad');});
    }else{
      total=E.slots.length;
      E.slots.forEach(s=>{const t=s.items[0]; if(!t){empty++;return;} if(s.accepts(t)){ok++;s.el.classList.add('ok');}else s.el.classList.add('bad');});
    }
    return {ok,total,empty};
  };
  E.reset=function(){ clearMarks();E.slots.forEach(s=>s.items=[]);shuffle(E.tiles).forEach(t=>E.bank.appendChild(t.el));select(null); };
  E.solve=function(){
    clearMarks();E.slots.forEach(s=>s.items=[]);E.tiles.forEach(t=>E.bank.appendChild(t.el));
    if(E.multi){E.tiles.forEach(t=>{const s=E.slots.find(s=>s.accepts(t)); if(s)place(t,s);});E.tiles.forEach(t=>t.el.classList.add('ok'));}
    else{E.slots.forEach(s=>{const t=E.tiles.find(t=>!loc(t)&&s.accepts(t)); if(t)place(t,s);});E.slots.forEach(s=>s.el.classList.add('ok'));}
    select(null);
  };
  E.summary=function(){
    return E.slots.map(s=>(s.label?strip(s.label)+': ':'')+(s.items.length?s.items.map(t=>t.text).join(', '):'–')).join('\n');
  };
  return E;
}

/* ---------- block scaffolding ---------- */
let blockNo=0;
function blockShell(cfg){
  const root=h('section',{class:'block'});
  if(cfg.title!==undefined){
    blockNo++;root.__no=blockNo;
    root.append(h('h2',{},h('span',{class:'num'},String(blockNo)),h('span',{html:cfg.title})));
  }
  if(cfg.task)root.append(h('p',{class:'task',html:cfg.task}));
  return root;
}
function controls(root,eng,cfg){
  const msg=h('span',{class:'msg'});
  const bC=h('button',{class:'act'},'Überprüfen');
  const bR=h('button',{class:'act sec'},'Zurücksetzen');
  const ctrl=h('div',{class:'ctrl'},bC,bR);
  let bS=null;
  if(!cfg.noSolve){bS=h('button',{class:'act sec'},'Lösung zeigen');ctrl.append(bS);}
  ctrl.append(msg);
  bC.onclick=()=>{
    const r=eng.check();
    if(r.ok===r.total){msg.className='msg good';msg.textContent=`Alles richtig! 🎉 (${r.ok} von ${r.total})`;}
    else{msg.className='msg';msg.textContent=`${r.ok} von ${r.total} richtig`+(r.empty?` – ${r.empty} noch nicht zugeordnet`:'')+(r.ok+r.empty<r.total?' – prüfe die rot markierten nochmal':'');}
  };
  bR.onclick=()=>{eng.reset();msg.textContent='';msg.className='msg';};
  if(bS)bS.onclick=()=>{eng.solve();msg.className='msg';msg.textContent='Lösung';};
  eng.onchange=()=>{ if(msg.textContent){msg.textContent='';msg.className='msg';} };
  root.append(ctrl);
}
function addHint(root,cfg){ root.append(h('div',{class:'hint'},cfg.hint||'Ziehe die Begriffe mit Maus oder Finger an die passende Stelle – oder tippe erst den Begriff und dann das Feld an.')); }
function fitFs(wcq,hcq,len,max){const lines=len<=24?1:Math.ceil(len/17);const per=Math.max(len/lines,3);return Math.min(max,wcq*0.86/(per*0.56),hcq*0.82/(lines*1.2))+'cqw';}

/* ---------- block types ---------- */
const BLOCKS={};

BLOCKS.text=function(cfg){
  const r=blockShell(cfg);
  r.append(h('div',{class:'box '+(cfg.cls||''),html:cfg.html}));
  return {node:r};
};

// fields over a picture or custom svg
BLOCKS.canvas=function(cfg,ctx){
  const r=blockShell(cfg);
  const fig=h('div',{class:'fig',style:`aspect-ratio:${cfg.w}/${cfg.h}`});
  if(cfg.img)fig.append(h('img',{class:'bg',src:IMG[cfg.img],alt:cfg.alt||''}));
  if(cfg.svg)fig.append(h('div',{class:'bgsvg',html:cfg.svg}));
  const bank=h('div',{class:'bank'});
  const slots=cfg.fields.map((f,i)=>{
    const el=h('div',{class:'slot'});
    el.style.left=(f.x/cfg.w*100)+'%';el.style.top=(f.y/cfg.h*100)+'%';el.style.width=(f.w/cfg.w*100)+'%';el.style.height=(f.h/cfg.h*100)+'%';
    el.style.setProperty('--fs',fitFs(f.w/cfg.w*100,f.h/cfg.w*100,f.a.length,cfg.maxfs||1.6));
    fig.append(el);
    return {el,accepts:t=>t.key===f.a,label:f.label||('Feld '+(i+1))};
  });
  r.append(fig,bank);
  const terms=cfg.terms||cfg.fields.map(f=>f.a);
  const eng=Engine({root:r,bank,slots,tiles:terms.map(t=>({text:t,long:t.length>24}))});
  controls(r,eng,cfg);addHint(r,cfg);
  return {node:r,summary:()=>cfg.sumTitle?cfg.sumTitle+'\n'+eng.summary():null};
};

// rows: left description, right slot
BLOCKS.match=function(cfg){
  const r=blockShell(cfg);
  const rows=h('div',{class:'rows'});const bank=h('div',{class:'bank'});
  const slots=cfg.rows.map(row=>{
    const el=h('div',{class:'rowslot'});
    rows.append(h('div',{class:'row'},h('div',{class:'lab',html:row.html}),el));
    return {el,accepts:t=>t.key===row.a,label:row.html};
  });
  r.append(rows,bank);
  const terms=cfg.terms||cfg.rows.map(x=>x.a);
  const eng=Engine({root:r,bank,slots,tiles:terms.map(t=>({text:t}))});
  controls(r,eng,cfg);addHint(r,cfg);
  return {node:r,summary:()=>cfg.sumTitle?cfg.sumTitle+'\n'+eng.summary():null};
};

// buckets: items sorted into categories
BLOCKS.sort=function(cfg){
  const r=blockShell(cfg);
  const wrap=h('div',{class:'buckets',style:`--cols:${cfg.buckets.length}`});
  const bank=h('div',{class:'bank'});
  const slots=cfg.buckets.map(b=>{
    const body=h('div',{class:'body'});
    const el=h('div',{class:'bucket',style:`--c:${b.color||'#555'}`},h('h3',{html:b.label}),body);
    wrap.append(el);
    return {el,body,multi:true,accepts:t=>t.cat===b.id,label:b.label};
  });
  r.append(bank,wrap);
  const eng=Engine({root:r,bank,slots,tiles:cfg.items.map(i=>({text:i.t,cat:i.cat,long:true}))});
  controls(r,eng,cfg);addHint(r,cfg);
  return {node:r,summary:()=>cfg.sumTitle?cfg.sumTitle+'\n'+eng.summary():null};
};

// cloze with dropdowns:  [[richtig|falsch1|falsch2]]
BLOCKS.cloze=function(cfg){
  const r=blockShell(cfg);
  const box=h('div',{class:'box cloze'});const sels=[];
  const html=cfg.text.replace(/\[\[([^\]]+)\]\]/g,(m,g)=>{const i=sels.length;sels.push(g.split('|'));return `<select class="cz" data-i="${i}"></select>`;});
  box.innerHTML=html;
  box.querySelectorAll('select.cz').forEach(sel=>{
    const opts=sels[+sel.dataset.i];sel.append(h('option',{value:''},'–'));
    shuffle(opts).forEach(o=>sel.append(h('option',{value:o},o)));
    sel.onchange=()=>{sel.classList.remove('ok','bad');msg.textContent='';};
  });
  const msg=h('span',{class:'msg'});
  const bC=h('button',{class:'act'},'Überprüfen'),bS=h('button',{class:'act sec'},'Lösung zeigen'),bR=h('button',{class:'act sec'},'Zurücksetzen');
  bC.onclick=()=>{let ok=0,empty=0;box.querySelectorAll('select.cz').forEach(s=>{s.classList.remove('ok','bad');const c=sels[+s.dataset.i][0];if(!s.value){empty++;return;}if(s.value===c){ok++;s.classList.add('ok');}else s.classList.add('bad');});
    msg.className='msg'+(ok===sels.length?' good':'');msg.textContent=ok===sels.length?`Alles richtig! 🎉 (${ok} von ${ok})`:`${ok} von ${sels.length} richtig`+(empty?` – ${empty} noch leer`:'');};
  bS.onclick=()=>{box.querySelectorAll('select.cz').forEach(s=>{s.value=sels[+s.dataset.i][0];s.classList.remove('bad');s.classList.add('ok');});msg.textContent='Lösung';msg.className='msg';};
  bR.onclick=()=>{box.querySelectorAll('select.cz').forEach(s=>{s.value='';s.classList.remove('ok','bad');});msg.textContent='';};
  r.append(box,h('div',{class:'ctrl'},bC,bR,bS,msg));
  return {node:r,summary:()=>cfg.sumTitle?cfg.sumTitle+'\n'+[...box.querySelectorAll('select.cz')].map(s=>s.value||'–').join(' | '):null};
};

// multiple choice (instant feedback)
BLOCKS.mc=function(cfg,ctx){
  const r=blockShell(cfg);const qs=[];let done=0,right=0;
  const score=h('div',{class:'msg',style:'margin-top:8px'});
  cfg.questions.forEach((q,qi)=>{
    const opts=shuffle(q.options.map((t,i)=>({t,c:i===0})));
    const why=h('div',{class:'why',html:q.why?('💡 '+q.why):''});
    const box=h('div',{class:'mcq'},h('div',{class:'q',html:`${qi+1}. ${q.q}`}));
    const og=h('div',{class:'opts'});let answered=false;
    opts.forEach(o=>{
      const b=h('button',{class:'opt',html:o.t});
      b.onclick=()=>{ if(answered)return;answered=true;done++;
        og.querySelectorAll('.opt').forEach((bb,ii)=>{if(opts[ii].c)bb.classList.add('ok');});
        if(o.c)right++;else b.classList.add('bad');
        why.classList.add('show');
        score.textContent=done===cfg.questions.length?`Geschafft: ${right} von ${cfg.questions.length} richtig`+(right===done?' 🎉':''):`${done} von ${cfg.questions.length} beantwortet`;
        if(done===cfg.questions.length)score.className='msg good';
      };
      og.append(b);
    });
    box.append(og,why);r.append(box);qs.push(q);
  });
  r.append(score);
  const api={node:r};
  const bR=h('button',{class:'act sec',onclick:()=>{const save=blockNo;if(r.__no)blockNo=r.__no-1;const f=BLOCKS.mc(cfg,ctx);blockNo=save;r.replaceWith(f.node);api.summary=f.summary;api.node=f.node;}},'Nochmal von vorn');r.append(h('div',{class:'ctrl'},bR));
  api.summary=()=>cfg.sumTitle?cfg.sumTitle+'\n'+(done?`${right} von ${cfg.questions.length} richtig`:'noch nicht bearbeitet'):null;
  return api;
};

// open text with starters + self-check
BLOCKS.open=function(cfg){
  const r=blockShell(cfg);
  const inputs=[];
  (cfg.fields||[{id:'t',label:null,rows:4,starters:cfg.starters,checks:cfg.checks}]).forEach(f=>{
    if(f.label)r.append(h('div',{style:'font-weight:650;margin:10px 0 4px',html:f.label}));
    let ta;
    if(f.line){ta=h('input',{class:'line',type:'text',placeholder:f.ph||''});}
    else{ta=h('textarea',{class:'open',rows:f.rows||4,placeholder:f.ph||'Schreibe hier deine Antwort …'});}
    if(f.starters&&f.starters.length){
      const st=h('div',{class:'starters'});
      f.starters.forEach(s=>st.append(h('button',{class:'chip',onclick:()=>{ta.value+=(ta.value&&!/\s$/.test(ta.value)?' ':'')+s+' ';ta.focus();upd();}},s)));
      r.append(st);
    }
    const cnt=h('div',{class:'counter'});
    function upd(){const n=ta.value.trim()?ta.value.trim().split(/\s+/).length:0;cnt.textContent=n+' Wörter'+(f.min?` (Ziel: mindestens ${f.min})`:'');}
    ta.addEventListener('input',upd);upd();
    r.append(ta);if(!f.line)r.append(cnt);
    let checks=[];
    if(f.checks&&f.checks.length){
      const cb=h('div',{class:'checks'});
      cb.append(h('div',{class:'mini'},'Selbstcheck – hast du daran gedacht? (Haken setzen, was in deiner Antwort vorkommt)'));
      f.checks.forEach(c=>{const i=h('input',{type:'checkbox'});checks.push({i,c});cb.append(h('label',{},i,h('span',{html:c})));});
      r.append(cb);
    }
    inputs.push({f,ta,checks});
  });
  return {node:r,summary:()=>{
    const out=[];if(cfg.sumTitle)out.push(cfg.sumTitle);
    inputs.forEach(x=>{ if(x.f.label)out.push(strip(x.f.label)); out.push(x.ta.value.trim()||'–'); if(x.checks.length)out.push('(Selbstcheck: '+x.checks.filter(c=>c.i.checked).length+' von '+x.checks.length+' Stichpunkten)'); });
    return out.join('\n');
  }};
};

    r.append(h('div',{class:'rate'},h('div',{html:t}),btns));

  return {node:r,summary:()=>cfg.sumTitle?cfg.sumTitle+'\n'+cfg.items.map((t,i)=>strip(t)+': '+(vals[i]==null?'–':faces[vals[i]][0]+' '+faces[vals[i]][1])).join('\n'):null};

/* ---------- page ---------- */
window.Page=function(cfg){
  const app=document.getElementById('app');
  document.title=cfg.title;
  function render(){
    blockNo=0;app.innerHTML='';
    const sheet=h('div',{class:'sheet'});
    sheet.append(h('div',{class:'top'},h('img',{class:'logo',src:IMG.logo,alt:'Schullogo'}),h('h1',{},cfg.title),h('img',{class:'mascot',src:IMG[cfg.mascot||'boy'],alt:''})));
    const name=h('input',{type:'text',placeholder:'Vorname (optional)'});
    sheet.append(h('div',{class:'namebar'},'Name:',name));
    if(cfg.intro)sheet.append(h('div',{class:'block'},h('div',{class:'box',html:cfg.intro})));
    const parts=[];
    const ctx={rebuild:render};
    cfg.blocks.forEach(b=>{const fn=BLOCKS[b.type];if(!fn)throw new Error('block '+b.type);const res=fn(b,ctx);sheet.append(res.node);parts.push(res);});
    // result
    const ta=h('textarea',{readonly:'readonly',placeholder:'Hier erscheint deine Zusammenfassung.'});
    const msg=h('span',{class:'msg'});
    const bCopy=h('button',{class:'act'},'📋 Meine Ergebnisse zusammenstellen & kopieren');
    bCopy.onclick=async()=>{
      const lines=[cfg.title,(name.value?'Name: '+name.value:''),''].filter((x,i)=>x||i==2);
      parts.forEach(p=>{if(p.summary){const s=p.summary();if(s){lines.push(s,'');}}});
      ta.value=lines.join('\n').trim();ta.style.display='block';
      let ok=false;try{await navigator.clipboard.writeText(ta.value);ok=true;}catch(e){}
      if(!ok){try{ta.focus();ta.select();ok=document.execCommand('copy');}catch(e){}}
      msg.className='msg good';msg.textContent=ok?'Kopiert! Du kannst den Text jetzt einfügen (z. B. in eine Abgabe).':'Markiere den Text unten und kopiere ihn mit Strg+C.';
    };
    const bPrint=h('button',{class:'act sec',onclick:()=>{try{window.print();}catch(e){}}},'🖨️ Drucken');
    ta.style.display='none';
    sheet.append(h('div',{class:'result'},h('div',{class:'ctrl'},bCopy,bPrint,msg),ta));
    sheet.append(h('div',{class:'block'},h('a',{class:'backlink',href:'index.html'},'← Zurück zur Übersicht')));
    app.append(h('a',{class:'backlink top',href:'index.html'},'← Zurück zur Übersicht'),sheet);
  }
  render();
};
})();
